---
version: 2
updates:

  # GitHub Workflows
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "cron"
      cronjob: "12 01 * * MON"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: ["deps"]

  # npm
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "cron"
      cronjob: "38 01 * * MON"
    cooldown:
      default-days: 5
      semver-major-days: 30
    commit-message:
      prefix: "update"
      include: scope
    labels: ["deps"]
    groups:
      all:
        patterns: ["*"]
